const isAdmin = () => !SUPA || ME.role === 'admin';
// Saved copy of records in this browser (IndexedDB), so each visit only downloads what changed
const IDB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => { try { const r = indexedDB.open('papertrail-cache', 1); r.onupgradeneeded = () => r.result.createObjectStore('c'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(d => new Promise(res => { try { const t = d.transaction('c', mode); const st = t.objectStore('c'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => res(null); t.onabort = () => res(null); } catch { res(null); } })).catch(() => null);
  return {get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => { st.put(v, k); }), clear: () => tx('readwrite', st => { st.clear(); })};
})();
const SB_PAGE = 1000;
function makeSupaDb(sb, uidKey){
  const subs = {}; // col -> [{map, cb, ready}]
  const maxTs = {}; const fireT = {}; const saveT = {};
  const ckey = c => `${uidKey}|${c}`;
  const bump = (c, ts) => { if (ts && (!maxTs[c] || ts > maxTs[c])) maxTs[c] = ts; };
  const persist = c => { clearTimeout(saveT[c]); saveT[c] = setTimeout(() => { const x = (subs[c] || [])[0]; if (x && x.ready) IDB.set(ckey(c), {map: x.map, max: maxTs[c] || '', at: Date.now()}); }, 2500); };
  const fire = c => { clearTimeout(fireT[c]); fireT[c] = setTimeout(() => { (subs[c] || []).forEach(x => { if (x.ready) x.cb(x.snap()); }); persist(c); }, 120); };
  const ch = sb.channel('pt-records').on('postgres_changes', {event: '*', schema: 'public', table: 'records'}, ev => {
    const row = ev.eventType === 'DELETE' ? ev.old : ev.new; if (!row || !row.col) return;
    if (row.col !== 'usage') useAdd('live', jsonSize(row) + 150);
    for (const x of subs[row.col] || []) { if (ev.eventType === 'DELETE') delete x.map[row.id]; else x.map[row.id] = row.data || {}; }
    if (ev.eventType !== 'DELETE') bump(row.col, row.updated_at);
    fire(row.col);
  });
  ch.subscribe();
  async function pages(build){
    const out = [];
    for (let from = 0, more = true; more; from += 4 * SB_PAGE) {   // four pages at a time
      const got = await Promise.all([0, 1, 2, 3].map(i => build().range(from + i * SB_PAGE, from + (i + 1) * SB_PAGE - 1)));
      for (const {data, error} of got) { if (error) throw error; out.push(...(data || [])); if (!data || data.length < SB_PAGE) { more = false; break; } }
    }
    return out;
  }
  async function loadAll(c){
    const cached = await IDB.get(ckey(c));
    if (cached && cached.map && cached.max) {
      const map = cached.map; maxTs[c] = cached.max;
      const changed = await pages(() => sb.from('records').select('id,data,updated_at').eq('col', c).gt('updated_at', cached.max).order('id'));
      for (const r of changed) { map[r.id] = r.data || {}; bump(c, r.updated_at); }
      useAdd('catch', jsonSize(changed) + 200);
      const {count, error} = await sb.from('records').select('id', {count: 'exact', head: true}).eq('col', c);
      if (error) throw error;
      if (count !== Object.keys(map).length) {   // out of step: drop what the server no longer has, fetch anything missing
        const ids = new Set((await pages(() => sb.from('records').select('id').eq('col', c).order('id'))).map(r => r.id));
        for (const id of Object.keys(map)) if (!ids.has(id)) delete map[id];
        const missing = [...ids].filter(id => !(id in map));
        for (let k = 0; k < missing.length; k += 200) {
          const {data, error: e2} = await sb.from('records').select('id,data,updated_at').eq('col', c).in('id', missing.slice(k, k + 200));
          if (e2) throw e2; for (const r of data || []) { map[r.id] = r.data || {}; bump(c, r.updated_at); } useAdd('catch', jsonSize(data));
        }
      }
      return map;
    }
    const map = {};
    const all = await pages(() => sb.from('records').select('id,data,updated_at').eq('col', c).order('id'));
    for (const r of all) { map[r.id] = r.data || {}; bump(c, r.updated_at); }
    if (all.length) useAdd('full', jsonSize(all));   // empty collections have no saved copy to reuse, so don't count them
    return map;
  }
  const fail = e => { const err = new Error((e && e.message) || 'Database error'); err.code = e && e.code === '42501' ? 'permission-denied' : (e && e.code) || 'unknown'; return err; };
  function docRef(c, id){
    return {
      async set(data){ const {error} = await sb.from('records').upsert({col: c, id, data}, {onConflict: 'col,id'}); if (error) throw fail(error); },
      async update(patch){ const {error} = await sb.rpc('merge_record', {p_col: c, p_id: id, p_patch: patch}); if (error) throw fail(error); },
      async delete(){ const {error} = await sb.from('records').delete().eq('col', c).eq('id', id); if (error) throw fail(error); },
      onSnapshot(cb, onErr){
        const x = {map: {}, ready: false, snap: () => null};
        x.cb = () => cb({exists: id in x.map, data: () => x.map[id]});
        (subs[c] = subs[c] || []).push(x);
        loadAll(c).then(m => { x.map = m; x.ready = true; x.cb(); }).catch(e => onErr && onErr(fail(e)));
        return () => { subs[c] = (subs[c] || []).filter(y => y !== x); };
      }
    };
  }
  return {
    collection(c){
      return {
        doc: id => docRef(c, id),
        onSnapshot(cb, onErr){
          const x = {map: {}, ready: false, cb};
          x.snap = () => ({docs: Object.entries(x.map).map(([id, d]) => ({id, data: () => d}))});
          (subs[c] = subs[c] || []).push(x);
          loadAll(c).then(m => { x.map = m; x.ready = true; cb(x.snap()); persist(c); }).catch(e => onErr && onErr(fail(e)));
          return () => { subs[c] = (subs[c] || []).filter(y => y !== x); };
        },
        async deleteMany(ids, onProgress){   // removes the given ids, 300 per request, 4 requests at a time
          const chunks = []; for (let k = 0; k < ids.length; k += 300) chunks.push(ids.slice(k, k + 300)); let done = 0;
          for (let k = 0; k < chunks.length; k += 4) {
            const res = await Promise.all(chunks.slice(k, k + 4).map(ch => sb.from('records').delete().eq('col', c).in('id', ch)));
            for (const {error} of res) if (error) throw fail(error);
            for (const ch of chunks.slice(k, k + 4)) { for (const x of subs[c] || []) for (const id of ch) delete x.map[id]; done += ch.length; }
            if (onProgress) onProgress(done);
          }
          fire(c);
        },
        async setMany(rows){   // rows: [[id, data], ...] saved 500 at a time
          for (let k = 0; k < rows.length; k += 500) {
            const chunk = rows.slice(k, k + 500);
            const {error} = await sb.from('records').upsert(chunk.map(([id, data]) => ({col: c, id, data})), {onConflict: 'col,id'});
            if (error) throw fail(error);
            for (const x of subs[c] || []) for (const [id, data] of chunk) x.map[id] = data;   // don't wait on live updates, which can lag during big imports
          }
          fire(c);
        }
      };
    },
    doc(path){ const [c, id] = path.split('/'); return docRef(c, id); }
  };
}
let USERS = []; // profiles rows

  USERS = rows || [];
  for (const u of USERS) P[u.id] = {name: u.name, email: u.email, role: u.role, active: u.active};
  const me = USERS.find(u => SUPA && SUPA.uid && u.user_id === SUPA.uid);
  if (me) ME = {id: me.id, name: me.name, email: me.email, role: me.role};
  team = {ids: USERS.filter(u => u.active).map(u => u.id)};
}
async function loadProfiles(){
  const {data, error} = await SUPA.sb.from('profiles').select('id,name,email,role,active,user_id').order('name');
  if (error) throw error;
  applyProfiles(data);

}

      await logAct({type: 'note', sys: true, text: `Merged ${nameOfR(other)} into this ${label}`, companyId: col === 'companies' ? keepId : keep.companyId, contactId: col === 'contacts' ? keepId : ''});
      toast(`Merged. ${n} linked record${n === 1 ? '' : 's'} moved.`);
      if (ui.dupReturn) { ui.dupReturn = false; setTimeout(() => dupFinder(col), 300); }
      return true;
    } : null);
}
function dupGroups(col){
  const items = L(col); const parent = {}; const find = x => parent[x] === x ? x : (parent[x] = find(parent[x])); const join = (a, b) => { parent[find(a)] = find(b); };
  items.forEach(x => parent[x.id] = x.id);
  const by = {}; const add = (k, id) => { if (!k) return; (by[k] = by[k] || []).push(id); };
  for (const x of items) {
    if (col === 'companies') { add('n:' + coKey(x.name), x.id); const ph = digits(x.phone); if (ph.length >= 10) add('p:' + ph, x.id); }
    else { for (const e of ctAddrs(x)) add('e:' + e, x.id); if (x.companyId && pname_(x)) add('n:' + x.companyId + '|' + norm(pname_(x)), x.id); }
  }
  for (const ids of Object.values(by)) for (let i = 1; i < ids.length; i++) join(ids[0], ids[i]);
  const groups = {}; for (const x of items) (groups[find(x.id)] = groups[find(x.id)] || []).push(x);
  return Object.values(groups).filter(g => g.length > 1).sort((a, b) => b.length - a.length);
}
function dupFinder(col){
  col = col || ui.dupCol || 'companies'; ui.dupCol = col;
  const groups = dupGroups(col);
  const nameOfR = r => col === 'companies' ? `${r.name}${r.city ? ' · ' + r.city : ''}${r.phone ? ' · ' + r.phone : ''}` : `${pname_(r)}${ctMail(r) ? ' · ' + ctMail(r) : ''} · ${cname(r.companyId)}`;
  const linked = r => col === 'companies' ? gr(r.id).contacts.length + gr(r.id).deals.length + gr(r.id).acts.length : L('deals').filter(d => d.contactId === r.id).length;
  openModal('Find duplicates', `<div class="segs" role="group" style="margin-bottom:10px">${[['companies', 'Accounts'], ['contacts', 'Contacts']].map(([k, l]) => `<button type="button" class="${col === k ? 'on' : ''}" data-act="dupTab" data-c="${k}">${l}</button>`).join('')}</div>
    <p class="sub" style="margin-bottom:10px">${groups.length ? `${groups.length} possible duplicate group${groups.length === 1 ? '' : 's'}, matched on ${col === 'companies' ? 'similar name or the same phone number' : 'the same email, or the same name at the same account'}. Review each before merging; similar isn't always the same.` : 'No likely duplicates found.'}</p>
    <ul class="users">${groups.slice(0, 150).map(g => { const sorted = g.slice().sort((a, b) => linked(b) - linked(a)); const keep = sorted[0];
      return `<li class="urow"><div>${sorted.map((r, i) => `<div><b>${i === 0 ? '' : '<span class="sub">duplicate: </span>'}${esc(nameOfR(r))}</b> <small style="display:inline">· ${linked(r)} linked</small></div>`).join('')}</div>
        <div class="uact"><button type="button" class="btn sm pri" data-act="dupReview" data-c="${col}" data-keep="${keep.id}" data-other="${sorted[1].id}">Review &amp; merge</button></div></li>`; }).join('')}</ul>
    ${groups.length > 150 ? `<p class="sub">Showing the first 150 groups. Merge some, then come back for the rest.</p>` : ''}`, null);
}

// ---------- attachments: files on accounts, saved as general or as a contract ----------
const FILE_MAX = 10 * 1024 * 1024, FILE_COUNT = 5;
const FIDB = (() => {   // demo + no-login site: files stay in this browser
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => { try { const r = indexedDB.open('papertrail-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(d => new Promise(res => { try { const t = d.transaction('f', mode); const out = fn(t.objectStore('f')); t.oncomplete = () => res(out && out.result); t.onerror = () => res(null); } catch { res(null); } })).catch(() => null);
  return {get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => { st.put(v, k); }), del: k => tx('readwrite', st => { st.delete(k); })};
})();
const FILES = {
  ok: () => !!(SUPA || STANDALONE || DEMO),
  remote: () => !!(SUPA && !DEMO),
  async put(path, file){
    if (FILES.remote()) { const {error} = await SUPA.sb.storage.from('files').upload(path, file, {contentType: file.type || 'application/octet-stream', upsert: false}); if (error) throw error; }
    else await FIDB.set(path, file);
  },
  async open(path, name){
    let url;
    if (FILES.remote()) { const {data, error} = await SUPA.sb.storage.from('files').createSignedUrl(path, 120, {download: name}); if (error) throw error; url = data.signedUrl; }
    else { const blob = await FIDB.get(path); if (!blob) throw new Error('That file is no longer in this browser.'); url = URL.createObjectURL(blob); setTimeout(() => URL.revokeObjectURL(url), 60000); }
    const a = document.createElement('a'); a.href = url; a.download = name || 'file'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  },
  async remove(paths){
    if (!paths.length) return;
    if (FILES.remote()) { try { await SUPA.sb.storage.from('files').remove(paths); } catch {} }
    else for (const pth of paths) await FIDB.del(pth);
  }
};
const fsize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const fileChips = files => (files || []).length ? `<div class="fchips">${files.map(f => `<button type="button" class="fchip" data-act="fileOpen" data-path="${esc(f.path)}" data-name="${esc(f.name)}" data-size="${+f.size || 0}" title="Download ${esc(f.name)}">${ic('doc')}<span>${esc(f.name)}</span><em>${fsize(f.size || 0)}</em></button>`).join('')}</div>` : '';
let attPending = [];
function attachModal(coId, intent){
  if (!FILES.ok()) { toast('Attachments work on the Paper Trail website. Open it there to add files.', 'bad'); return; }
  attPending = [];
  const coPick = coId ? '' : F('Account', sel('attCo', coOpts('— Choose an account —'), '', 'id="attCo" required'));
  openModal(intent === 'contract' ? 'Add a contract' : 'Add attachments', `${coPick}
    <div class="drop" id="dropZone" tabindex="0" role="button" aria-label="Choose files to attach">
      ${ic('up')}<b>Drag and drop your files or <span class="lnkish">browse</span></b>
      <small>Up to ${FILE_COUNT} files at a time, under 10 MB each.</small>
      <input type="file" id="attInput" multiple hidden data-change="attFiles">
    </div>
    <ul class="attlist" id="attList"></ul>
    <label class="f"><span>Description (optional)</span><textarea name="attNote" id="attNote" rows="2" placeholder="${intent === 'contract' ? 'e.g. Signed monthly shredding agreement' : 'e.g. Photos of the file room'}"></textarea></label>
    <input type="hidden" name="attCoFixed" value="${esc(coId || '')}">`, null, null,
    {foot: `<button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="button" class="btn" data-act="attSave" data-k="general" id="attGen">Save as general</button><button type="button" class="btn pri" data-act="attSave" data-k="contract" id="attCon">${ic('doc')}Save as contract</button>`});
  attRender();
}
function attAdd(list){
  for (const f of list) {
    if (attPending.length >= FILE_COUNT) { toast(`Up to ${FILE_COUNT} files at a time.`, 'bad'); break; }
    if (f.size > FILE_MAX) { toast(`${f.name} is over 10 MB.`, 'bad'); continue; }
    if (!attPending.some(x => x.name === f.name && x.size === f.size)) attPending.push(f);
  }
  attRender();
}
function attRender(){
  const l = $('#attList'); if (!l) return;
  l.innerHTML = attPending.map((f, i) => `<li>${ic('doc')}<span>${esc(f.name)}</span><em>${fsize(f.size)}</em><button type="button" class="icon-btn" data-act="attRemove" data-i="${i}" aria-label="Remove ${esc(f.name)}">${ic('x')}</button></li>`).join('');
  ['#attGen', '#attCon'].forEach(x => { const b = $(x); if (b) b.disabled = !attPending.length; });
}
async function attSave(kind){
  const fm = $('#mform'); if (!fm) return;
  const coId = (fm.attCoFixed && fm.attCoFixed.value) || ($('#attCo') && $('#attCo').value);
  if (!coId) { toast('Choose an account first.', 'bad'); return; }
  if (!attPending.length) { toast('Add at least one file.', 'bad'); return; }
  const note = ($('#attNote') && $('#attNote').value.trim()) || '';
  const btns = [$('#attGen'), $('#attCon')]; btns.forEach(b => b && (b.disabled = true));
  const label = kind === 'contract' ? $('#attCon') : $('#attGen');
  const files = [];
  try {
    for (let i = 0; i < attPending.length; i++) {
      const f = attPending[i]; if (label) label.textContent = `Uploading ${i + 1} of ${attPending.length}…`;
      const safe = f.name.replace(/[^\w.\- ]+/g, '_').slice(-120);
      const path = `${coId}/${uid()}/${safe}`;
      await FILES.put(path, f);
      files.push({path, name: f.name, size: f.size, type: f.type || ''});
    }
  } catch (e) {
    toast("Couldn't upload: " + ((e && e.message) || 'unknown error'), 'bad'); btns.forEach(b => b && (b.disabled = false)); if (label) label.textContent = kind === 'contract' ? 'Save as contract' : 'Save as general';
    await FILES.remove(files.map(f => f.path)); return;
  }

  if (kind === 'contract') {

    await put('contracts', cid, {companyId: coId, title, note, files, status: 'active', ownerId: ME.id, addedBy: ME.id});

    await logAct({type: 'file', text: note || `Attached ${names}`, companyId: coId, files});

}
function contractView(id){
  const c = S.contracts[id]; if (!c) return;
  openModal('Contract', `${F('Name', inp('title', c.title || 'Contract', 'text', 'required'))}
    <p class="sub" style="margin:6px 0 10px">${link('companies', c.companyId) || ''} · added ${esc(c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'}) : '')}${c.addedBy || c.ownerId ? ' by ' + esc(nm(c.addedBy || c.ownerId)) : ''}</p>
    <div class="f"><span>Files</span>${fileChips(c.files) || '<p class="sub">No files.</p>'}</div>
    <label class="f"><span>Notes</span>${ta('note', c.note || '', 3)}</label>`, 'Save', async f => {
      if (!(f.title || '').trim()) { toast('Give the contract a name.', 'bad'); return false; }
      return patch('contracts', id, {title: f.title.trim(), note: f.note || ''});
    }, {foot: canWrite ? `<button type="button" class="btn ghost" data-act="delContractFile" data-id="${id}" style="margin-right:auto">${ic('trash')}Delete</button>` : ''});
}

async function boot(){

  try { history.replaceState(navState(), '', navHash(navState())); } catch {}

  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  let [u, d, s, dl, mc] = await Promise.all([use('user'), use('db'), use('sample'), use('downloads'), use('mcp')]);
  if (!d && !window.claude && window.PAPER_TRAIL && window.PAPER_TRAIL.supabaseUrl && window.supabase && !GUEST) {
    try { d = await supaStart(); } catch (e) { $('#main').innerHTML = `<div class="wrap"><p class="banner">Couldn't connect to the Paper Trail database: ${esc((e && e.message) || 'unknown error')}. Check config.js and reload.</p></div>`; return; }
  }

  if (d) {

    for (const c of COLS) {
      db.collection(c).onSnapshot(snap => { const o = {}; snap.docs.forEach(x => { o[x.id] = x.data(); }); REAL[c] = o; if (!DEMO) S[c] = o; loaded[c] = true; if (c === 'companies') { hayReset(); acctHeal(); } schedule(); },
        err => { loaded[c] = true; if (err && err.code === 'revoked') { canWrite = false; toast('Your access to this CRM changed. Reload to continue.', 'bad'); } else toast("Lost the live connection to your records. Reload the page.", 'bad'); schedule(); });
    }
    if (!SUPA) db.doc('meta/team').onSnapshot(snap => { team = snap.exists ? {ids: snap.data().ids || []} : {ids: []}; schedule(); if (!$('#modal').hidden && $('#teamList')) { const keepQ = $('#teamQ')?.value; teamModal(); if (keepQ) { $('#teamQ').value = keepQ; } } }, () => {});
  }
  if (!d && !window.claude) { STANDALONE = true; if (!GUEST) loadLocal(); }
  loadLookLocal();
  if (!h && LOOK.start && LOOK.start !== 'today' && VIEWS.some(v => v[0] === LOOK.start)) { ui.view = LOOK.start; try { history.replaceState(navState(), '', navHash(navState())); } catch {} }
  booted = true; bootDone(); setTimeout(acctHeal, 4000); setTimeout(() => { if (DRIVE_BACKUP && SUPA && !DEMO && isAdmin()) drvLoad(); }, 5000);
  syncLookFromDb();

  schedule();
}
boot();
})();
