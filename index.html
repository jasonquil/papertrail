const ctx = {quoteId: null};
function fillCompanies(cur){
  const cos = api.L("companies").sort((a,b) => (a.name||"").localeCompare(b.name||""));
  $("co").innerHTML = '<option value="">— Choose a company —</option>' + cos.map(c => `<option value="${esc(c.id)}">${esc(c.name||"")}</option>`).join("");
  $("co").value = cur || "";
}
function fillDeals(coId, cur){
  const ds = api.L("deals").filter(d => d.companyId === coId && (api.isOpen(d) || d.id === cur));
  $("deal").innerHTML = '<option value="">— None —</option>' + ds.map(d => `<option value="${esc(d.id)}">${esc(oppTypeName(d.name) || "Opportunity")}</option>`).join("");
  $("deal").value = cur || "";
}
function fillCust(){
  const co = api.S.companies[$("co").value]; if(!co){ return; }
  const deal = api.S.deals[$("deal").value];
  const ct = (deal && deal.contactId && api.S.contacts[deal.contactId]) || api.L("contacts").find(c => c.companyId === co.id);
  const cityLine = [[co.city, co.state].filter(Boolean).join(", "), co.zip].filter(Boolean).join(" ");
  $("cust").value = [co.name, ct ? "Attn: " + api.pname(ct) : "", co.address, cityLine].filter(Boolean).join("\n");
  renderPreview();
}
function setTitle(){
  $("qbTitle").textContent = (ctx.quoteId ? "Quote " : "New quote ") + ($("qnum").value.trim());
  $("delQuote").hidden = !ctx.quoteId || !api.canWrite();
}
function open(o){
  o = o || {};
  host.hidden = false;
  doReset();
  ctx.quoteId = o.quoteId || null;
  const q = ctx.quoteId ? api.S.quotes[ctx.quoteId] : null;
  fillCompanies(q ? q.companyId : o.co);
  $("status").textContent = ""; $("status").className = "status";
  if(q && q.state){
    restoreState(q.state);
    fillCompanies(q.companyId); fillDeals(q.companyId, q.dealId);
    $("qstatus").value = q.status || "draft"; $("qnum").value = q.number || "";
    setEditing(ctx.quoteId, api.cname(q.companyId));
  } else {
    fillDeals(o.co || "", o.deal || "");
    $("qstatus").value = "draft"; $("qnum").value = api.nextQuoteNo();
    setEditing(null); fillCust();
  }
  setTitle(); renderMode(); loadCur(); renderAll();
  host.scrollTop = 0;
  setTimeout(() => { ($("co").value ? $("cust") : $("co")).focus(); }, 40);
}
function close(){ host.hidden = true; api.onClose(); }
function isOpenNow(){ return !host.hidden; }
async function persist(status, S, pages){
  const coId = $("co").value; if(!coId) return null;
  if(!$("qnum").value.trim()) $("qnum").value = api.nextQuoteNo();
  const items = pages.flatMap(p => p.lines.map(l => ({desc: (pages.length > 1 ? "Location " + p.pageNo + ": " : "") + l.desc, qty: l.qty, price: l.price})));
  const total = Math.round(pages.reduce((s,p) => s + p.total, 0) * 100) / 100;
  const id = await api.saveQuote(ctx.quoteId, {companyId: coId, dealId: $("deal").value, number: $("qnum").value.trim(), status,
    quoteDate: S.date, validUntil: S.valid, preparedBy: S.rep, items, total, serviceLine: isMW() ? "mw" : "shred", pricing: mode, locations: pages.length, state: snapshotState()});
  if(id){ ctx.quoteId = id; setEditing(id, api.cname(coId)); setTitle(); }
  return id;
}

return {open, close, isOpen: isOpenNow};

}

let QB = null;
function quoteBuilder(){
  if (QB) return QB;
  const host = $('#qbHost');
  const root = host.attachShadow({mode: 'open'});
  root.append($('#qbTpl').content.cloneNode(true));
  const sync = () => { const t = document.documentElement.getAttribute('data-theme'); host.classList.toggle('dark', t === 'dark'); host.classList.toggle('light', t === 'light'); };
  sync(); try { new MutationObserver(sync).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']}); } catch {}
  QB = makeQuoteBuilder(root, host, {S, L, isOpen, cname, pname: pname_, nextQuoteNo, canWrite: () => canWrite, saveQuote: saveBuiltQuote,
    deleteQuote: deleteQuoteNow, startJourney: o => journeyStartModal({co: o.co, deal: o.deal, first: 'in'}), onClose: () => schedule()});
  return QB;
}
async function afterQuoteStatus(prev, rec, nid){
  if (prev.status !== rec.status && rec.status !== 'draft') logAct({type:'note', text:`Quote ${rec.number} marked ${rec.status} (${money2(qTotal(rec))})`, companyId: rec.companyId, dealId: rec.dealId, quoteId: nid});
  const deal = rec.dealId && S.deals[rec.dealId];
  if (deal && isOpen(deal)) {
    if (rec.status === 'accepted' && prev.status !== 'accepted') { await setStage(rec.dealId, 'won', qTotal(rec)); toast('Quote accepted. Opportunity marked Closed Won.'); return; }
    if (rec.status === 'sent' && (deal.stage||'lead') === 'lead') { await setStage(rec.dealId, 'quoted'); toast('Opportunity moved to Proposal Out.'); return; }
  }
  toast('Quote saved');
}
async function saveBuiltQuote(id, body){
  { const dupQ = L('quotes').find(x => x.id !== id && norm(x.number) === norm(body.number)); if (dupQ) { toast(`Quote number ${body.number} is already used. Change the quote number and save again.`, 'bad'); return null; } }
  const nid = id || uid(); const prev = id ? (S.quotes[id] || {}) : {};
  const rec = {...prev, ...body, ownerId: prev.ownerId || ME.id};
  if (rec.status === 'sent' && prev.status !== 'sent' && !prev.sentAt) rec.sentAt = Date.now();
  if (!await put('quotes', nid, rec)) return null;
  await afterQuoteStatus(prev, rec, nid);
  return nid;
}
async function deleteQuoteNow(id){
  const q = S.quotes[id]; if (!q) return true;
  const pre = `Quote ${q.number} marked `;
  for (const a of L('activities')) if (a.quoteId === id || (a.companyId === q.companyId && String(a.text||'').startsWith(pre))) await del('activities', a.id);
  const ok = await del('quotes', id); if (ok) toast('Quote deleted');
  return ok;
}

// ---------- hosted mode: Supabase logins, users and shared data ----------
const isAdmin = () => !SUPA || ME.role === 'admin';
// Saved copy of records in this browser (IndexedDB), so each visit only downloads what changed
const IDB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => { try { const r = indexedDB.open('papertrail-cache', 1); r.onupgradeneeded = () => r.result.createObjectStore('c'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(d => new Promise(res => { try { const t = d.transaction('c', mode); const st = t.objectStore('c'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => res(null); t.onabort = () => res(null); } catch { res(null); } })).catch(() => null);
  return {get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => { st.put(v, k); }), clear: () => tx('readwrite', st => { st.clear(); })};
})();
const SB_PAGE = 1000;
function makeSupaDb(sb, uidKey){
  const subs = {}; // col -> [{map, cb, ready}]
  const maxTs = {}; const fireT = {}; const saveT = {};
  const ckey = c => `${uidKey}|${c}`;
  const bump = (c, ts) => { if (ts && (!maxTs[c] || ts > maxTs[c])) maxTs[c] = ts; };
  // ask for changes from a couple of minutes before the last one seen: two saves landing at almost the same moment can be
  // stamped slightly out of order, and the overlap makes sure neither is missed (anything fetched twice is just the same)
  const since = ts => { const t = Date.parse(ts); return isNaN(t) ? ts : new Date(t - 120000).toISOString(); };
  const persist = c => { clearTimeout(saveT[c]); saveT[c] = setTimeout(() => { const x = (subs[c] || [])[0]; if (x && x.ready) IDB.set(ckey(c), {map: x.map, max: maxTs[c] || '', at: Date.now()}); }, 2500); };
  const fire = c => { clearTimeout(fireT[c]); fireT[c] = setTimeout(() => { (subs[c] || []).forEach(x => { if (x.ready) x.cb(x.snap()); }); persist(c); }, 120); };
  const ch = sb.channel('pt-records').on('postgres_changes', {event: '*', schema: 'public', table: 'records'}, ev => {
    const row = ev.eventType === 'DELETE' ? ev.old : ev.new; if (!row || !row.col) return;
    if (row.col !== 'usage') useAdd('live', jsonSize(row) + 150);
    for (const x of subs[row.col] || []) { if (ev.eventType === 'DELETE') delete x.map[row.id]; else x.map[row.id] = row.data || {}; }
    if (ev.eventType !== 'DELETE') bump(row.col, row.updated_at);
    fire(row.col);
  });
  // If the live feed drops (laptop sleep, Wi-Fi blip, a long load), changes stop arriving. Supabase reconnects it on its own;
  // when it comes back, catch up on whatever was missed while it was down.
  let chUp = false, caughtOnce = false;
  function onStatus(st){
    if (st === 'SUBSCRIBED') { if (!chUp && caughtOnce) catchUpAll(); chUp = true; caughtOnce = true; }
    else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') chUp = false;
  }
  ch.subscribe(onStatus);
  // each page starts after the last id of the one before ("keyset" paging), so page 30 is as quick as page 1;
  // skipping rows by count got slow enough with 80,000 records to hit Supabase's time limit
  const retry = async (fn, tries = 4) => { for (let n = 1; ; n++) { const r = await fn(); if (!r.error || n >= tries) return r; await new Promise(ok => setTimeout(ok, 800 * n * n)); } };
  async function pages(build, prog){
    const out = []; let last = null;
    for (;;) {
      const {data, error} = await retry(() => { let q = build(); if (last != null) q = q.gt('id', last); return q.limit(SB_PAGE); });
      if (error) throw error;
      out.push(...(data || [])); if (prog) prog(out.length);
      if (!data || data.length < SB_PAGE) return out;
      last = data[data.length - 1].id;
    }
  }
  // fetch what changed on the server since this copy was last current (and drop anything deleted), then redraw
  async function catchUp(c){
    const x0 = (subs[c] || []).find(x => x.ready); if (!x0 || !maxTs[c]) return;
    const changed = await pages(() => sb.from('records').select('id,data,updated_at').eq('col', c).gt('updated_at', since(maxTs[c])).order('id'));
    for (const r of changed) { for (const x of subs[c] || []) x.map[r.id] = r.data || {}; bump(c, r.updated_at); }
    if (changed.length) useAdd('catch', jsonSize(changed) + 200);
    const {count, error} = await retry(() => sb.from('records').select('id', {count: 'exact', head: true}).eq('col', c));
    if (!error && count !== Object.keys(x0.map).length) {
      const ids = new Set((await pages(() => sb.from('records').select('id').eq('col', c).order('id'))).map(r => r.id));
      for (const x of subs[c] || []) for (const id of Object.keys(x.map)) if (!ids.has(id)) delete x.map[id];
    }
    fire(c);
  }
  let catching = null;
  function catchUpAll(){
    if (catching) return catching;
    catching = Promise.all(Object.keys(subs).map(c => catchUp(c).catch(e => console.warn('Paper Trail: catching up ' + c + ' failed', e)))).finally(() => { catching = null; });
    return catching;
  }
  // coming back to the tab or back online: catch up, and reconnect the live feed if it dropped
  let lastCatch = 0;
  const wake = () => { if (Date.now() - lastCatch < 20000) return; lastCatch = Date.now(); catchUpAll(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
  addEventListener('online', wake);
  async function loadAll(c){
    const cached = await IDB.get(ckey(c));
    if (cached && cached.map && cached.max) {
      const map = cached.map; maxTs[c] = cached.max;
      const changed = await pages(() => sb.from('records').select('id,data,updated_at').eq('col', c).gt('updated_at', since(cached.max)).order('id'));
      for (const r of changed) { map[r.id] = r.data || {}; bump(c, r.updated_at); }
      useAdd('catch', jsonSize(changed) + 200);
      const {count, error} = await retry(() => sb.from('records').select('id', {count: 'exact', head: true}).eq('col', c));
      if (error) throw error;
      if (count !== Object.keys(map).length) {   // out of step: drop what the server no longer has, fetch anything missing
        const ids = new Set((await pages(() => sb.from('records').select('id').eq('col', c).order('id'))).map(r => r.id));
        for (const id of Object.keys(map)) if (!ids.has(id)) delete map[id];
        const missing = [...ids].filter(id => !(id in map));
        for (let k = 0; k < missing.length; k += 200) {
          const {data, error: e2} = await retry(() => sb.from('records').select('id,data,updated_at').eq('col', c).in('id', missing.slice(k, k + 200)));
          if (e2) throw e2; for (const r of data || []) { map[r.id] = r.data || {}; bump(c, r.updated_at); } useAdd('catch', jsonSize(data));
        }
      }
      return map;
    }
    const map = {};
    const cnt = await retry(() => sb.from('records').select('id', {count: 'exact', head: true}).eq('col', c)); const total = cnt && !cnt.error ? cnt.count : null; ptlProg(c, 0, total);   // the loading screen shows how far along each set is
    const all = await pages(() => sb.from('records').select('id,data,updated_at').eq('col', c).order('id'), n => ptlProg(c, n, total));
    for (const r of all) { map[r.id] = r.data || {}; bump(c, r.updated_at); }
    if (all.length) useAdd('full', jsonSize(all));   // empty collections have no saved copy to reuse, so don't count them
    return map;
  }
  const fail = e => { const err = new Error((e && e.message) || 'Database error'); err.code = e && e.code === '42501' ? 'permission-denied' : (e && e.code) || 'unknown'; return err; };
  function docRef(c, id){
    return {
      // Each save shows on screen as soon as Supabase confirms it, instead of waiting for the live feed to echo it back.
      // (If the live feed had dropped, the screen used to keep showing the old value even though the save went through.)
      async set(data){ const {error} = await sb.from('records').upsert({col: c, id, data}, {onConflict: 'col,id'}); if (error) throw fail(error); for (const x of subs[c] || []) x.map[id] = data; fire(c); },
      async update(patch){ const {error} = await sb.rpc('merge_record', {p_col: c, p_id: id, p_patch: patch}); if (error) throw fail(error); for (const x of subs[c] || []) if (x.map[id]) x.map[id] = {...x.map[id], ...patch}; fire(c); },
      async delete(){ const {error} = await sb.from('records').delete().eq('col', c).eq('id', id); if (error) throw fail(error); for (const x of subs[c] || []) delete x.map[id]; fire(c); },
      onSnapshot(cb, onErr){

        x.cb = () => cb({exists: id in x.map, data: () => x.map[id]});

        const go = n => loadAll(c).then(m => { x.map = m; x.ready = true; x.cb(); }).catch(e => { if (n < 3) setTimeout(() => go(n + 1), 3000 * n); else if (onErr) onErr(fail(e)); });
        go(1);
        return () => { subs[c] = (subs[c] || []).filter(y => y !== x); };
      }
    };
  }

    collection(c){
      return {
        doc: id => docRef(c, id),
        onSnapshot(cb, onErr){
          const x = {map: {}, ready: false, cb};
          x.snap = () => ({docs: Object.entries(x.map).map(([id, d]) => ({id, data: () => d}))});
          (subs[c] = subs[c] || []).push(x);
          const go = n => loadAll(c).then(m => { x.map = m; x.ready = true; cb(x.snap()); persist(c); }).catch(e => { console.warn('Paper Trail: loading ' + c + ' failed (try ' + n + ')', e); if (n < 3) setTimeout(() => go(n + 1), 3000 * n); else if (onErr) onErr(fail(e)); });
          go(1);
          return () => { subs[c] = (subs[c] || []).filter(y => y !== x); };
        },
        async deleteMany(ids, onProgress){   // removes the given ids, 300 per request, 4 requests at a time
          const chunks = []; for (let k = 0; k < ids.length; k += 300) chunks.push(ids.slice(k, k + 300)); let done = 0;

            const res = await Promise.all(chunks.slice(k, k + 4).map(ch => sb.from('records').delete().eq('col', c).in('id', ch)));
            for (const {error} of res) if (error) throw fail(error);
            for (const ch of chunks.slice(k, k + 4)) { for (const x of subs[c] || []) for (const id of ch) delete x.map[id]; done += ch.length; }
